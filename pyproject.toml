[project]
name = "zalo-ai-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"transformers",
	"qwen_vl_utils",
	"decord",
	"huggingface_hub",
	"ipykernel",
	"bitsandbytes>=0.48.2",
	"accelerate>=1.11.0",
	"torch>=2.9.1",
	"torchvision>=0.24.1",
]


[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'win32'"},
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'"}
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'win32'"},
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'"},
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

flash-attn = { url = "https://github.com/loscrossos/lib_flashattention/releases/download/v2.7.4.post1_crossos00/flash_attn-2.7.4.post1+cu129torch2.7.0-cp312-cp312-win_amd64.whl" }
clip = { git = "https://github.com/openai/CLIP.git" }
