[project]
name = "zalo-ai-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "flash-attn",
    "numpy",
    "accelerate",
    "transformers",
    "clip",
    "ipykernel",
    "langchain-huggingface",
    "pandas",
    "langchain",
    "sentence-transformers",
    "pymilvus",
    "beautifulsoup4",
    "bitsandbytes",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

flash-attn = { url = "https://github.com/loscrossos/lib_flashattention/releases/download/v2.7.4.post1_crossos00/flash_attn-2.7.4.post1+cu129torch2.7.0-cp312-cp312-win_amd64.whl" }
clip = { git = "https://github.com/openai/CLIP.git" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true